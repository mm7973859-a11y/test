<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AL-BATOUL Store</title>

<style>
:root{
 --main:#001d3d;--gold:#ffd60a;--red:#d90429;--bg:#f4f6f8;
}
*{box-sizing:border-box;font-family:Segoe UI}
body{margin:0;background:var(--bg);padding-bottom:100px}

/* header */
header{
 background:var(--main);color:#fff;padding:15px;
 display:flex;justify-content:space-between;align-items:center;
 position:sticky;top:0;z-index:10
}
.logo{color:var(--gold);font-weight:900;cursor:pointer}

/* categories */
.cats{
 display:flex;gap:8px;padding:10px;background:#fff;overflow-x:auto
}
.cats button{
 border:none;padding:8px 16px;border-radius:20px;
 background:#eee;font-weight:bold;cursor:pointer
}
.cats .active{background:var(--main);color:#fff}

/* products */
.grid{
 display:grid;grid-template-columns:repeat(2,1fr);
 gap:12px;padding:12px
}
.card{
 background:#fff;border-radius:12px;padding:10px;
 box-shadow:0 2px 8px rgba(0,0,0,.08);
 display:flex;flex-direction:column;position:relative
}
.card img{
 width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px
}
.card h4{font-size:14px;margin:6px 0}
.price{color:var(--red);font-weight:bold}
.card button{
 margin-top:auto;background:var(--gold);
 border:none;padding:10px;border-radius:8px;font-weight:bold
}
.del{
 position:absolute;top:5px;left:5px;
 background:red;color:#fff;width:25px;height:25px;
 border-radius:50%;display:none;align-items:center;justify-content:center;
 cursor:pointer
}

/* cart bar */
.cart-bar{
 position:fixed;bottom:15px;left:50%;
 transform:translateX(-50%);
 width:90%;background:var(--main);color:#fff;
 padding:15px;border-radius:50px;
 display:none;justify-content:space-between
}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none}
.modal{
 position:fixed;bottom:0;left:0;right:0;
 background:#fff;border-radius:20px 20px 0 0;
 padding:20px;max-height:80vh;overflow:auto;
 transform:translateY(100%);transition:.3s
}
.modal.show{transform:translateY(0)}
.item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}
.total{color:var(--red);font-weight:bold;text-align:center;margin:10px}
input,select{
 width:100%;padding:10px;margin-bottom:10px;
 border:1px solid #ccc;border-radius:8px
}
.action{background:var(--main);color:#fff;border:none;padding:12px;border-radius:8px;font-weight:bold;width:100%}
</style>
</head>

<body>

<header>
 <div class="logo" onclick="adminLogin()">AL-BATOUL</div>
 <div onclick="openCart()">🛒 <span id="count">0</span></div>
</header>

<div class="cats" id="cats"></div>
<div class="grid" id="grid"></div>

<div class="cart-bar" id="cartBar" onclick="openCart()">
 <span>🛒 السلة (<span id="count2">0</span>)</span>
 <span>إتمام الطلب</span>
</div>

<div class="overlay" onclick="closeAll()"></div>

<!-- cart modal -->
<div class="modal" id="cartModal">
 <h3>سلة الشراء</h3>
 <div id="cartList"></div>
 <div class="total" id="total"></div>
 <input id="cName" placeholder="الاسم">
 <input id="cPhone" placeholder="رقم الهاتف">
 <button class="action" onclick="sendWA()">إرسال واتساب</button>
</div>

<!-- admin modal -->
<div class="modal" id="adminModal">
 <h3>إضافة منتج</h3>
 <input id="pName" placeholder="اسم المنتج">
 <input id="pPrice" type="number" placeholder="السعر">
 <select id="pCat">
  <option>منظفات</option><option>أدوات منزلية</option>
  <option>عناية شخصية</option><option>ألعاب</option>
 </select>
 <input id="pImg" placeholder="رابط صورة">
 <button class="action" onclick="addProduct()">حفظ</button>
</div>

<script>
let isAdmin=false;

let products=JSON.parse(localStorage.getItem("products"))||[
 {id:1,name:"سائل تنظيف",price:30,cat:"منظفات",img:"https://via.placeholder.com/400"},
 {id:2,name:"منشفة",price:50,cat:"أدوات منزلية",img:"https://via.placeholder.com/400"},
 {id:3,name:"شامبو",price:40,cat:"عناية شخصية",img:"https://via.placeholder.com/400"}
];

let cart=JSON.parse(localStorage.getItem("cart"))||{};
let cats=["الكل",...new Set(products.map(p=>p.cat))];

function renderCats(){
 document.getElementById("cats").innerHTML=cats.map((c,i)=>
 `<button class="${i==0?'active':''}" onclick="filter('${c}',this)">${c}</button>`
 ).join("");
}

function render(list=products){
 document.getElementById("grid").innerHTML=list.map(p=>`
 <div class="card">
  <div class="del" style="display:${isAdmin?'flex':'none'}" onclick="del(${p.id})">✖</div>
  <img src="${p.img}">
  <h4>${p.name}</h4>
  <div class="price">${p.price} ج</div>
  <button onclick="add(${p.id})">أضف للسلة</button>
 </div>`).join("");
}

function filter(c,btn){
 document.querySelectorAll(".cats button").forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");
 render(c=="الكل"?products:products.filter(p=>p.cat==c));
}

function add(id){
 cart[id]?cart[id].qty++:(cart[id]={...products.find(p=>p.id==id),qty:1});
 saveCart();
}

function saveCart(){
 localStorage.setItem("cart",JSON.stringify(cart));
 updateUI();
}

function updateUI(){
 let c=0,t=0;
 for(let k in cart){c+=cart[k].qty;t+=cart[k].price*cart[k].qty;}
 count.innerText=count2.innerText=c;
 total.innerText="الإجمالي: "+t+" ج";
 cartBar.style.display=c?"flex":"none";
}

function openCart(){
 cartList.innerHTML=Object.keys(cart).length?
 Object.values(cart).map(p=>`
 <div class="item">
  <span>${p.name} x${p.qty}</span>
  <span style="color:red;cursor:pointer" onclick="rem(${p.id})">حذف</span>
 </div>`).join(""):"السلة فارغة";
 show("cartModal");
}

function rem(id){delete cart[id];saveCart();openCart();}
function show(id){overlay.style.display="block";document.getElementById(id).classList.add("show")}
function closeAll(){overlay.style.display="none";document.querySelectorAll(".modal").forEach(m=>m.classList.remove("show"))}

function sendWA(){
 let n=cName.value,ph=cPhone.value;
 if(!n||!ph)return alert("أكمل البيانات");
 let msg=`طلب من ${n} (${ph})\n`;
 for(let k in cart)msg+=`- ${cart[k].name} x${cart[k].qty}\n`;
 window.open("https://wa.me/201000000000?text="+encodeURIComponent(msg));
 cart={};saveCart();closeAll();
}

function adminLogin(){
 if(prompt("كلمة السر")=="1234"){isAdmin=true;render();show("adminModal")}
}

function addProduct(){
 let p={id:Date.now(),name:pName.value,price:+pPrice.value,cat:pCat.value,img:pImg.value};
 products.push(p);
 localStorage.setItem("products",JSON.stringify(products));
 cats=["الكل",...new Set(products.map(p=>p.cat))];
 renderCats();render();closeAll();
}

function del(id){
 products=products.filter(p=>p.id!=id);
 localStorage.setItem("products",JSON.stringify(products));
 render();
}

renderCats();render();updateUI();
</script>

</body>
</html>
