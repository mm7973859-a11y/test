<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>البتول | AL-BATOUL</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root { --main: #001d3d; --gold: #ffd60a; --bg: #f8f9fa; --red: #d90429; --green: #25D366; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { margin: 0; background: var(--bg); padding-bottom: 120px; }

        /* الهيدر */
        header { background: var(--main); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 900; }
        .logo { font-size: 18px; font-weight: 900; color: var(--gold); cursor: pointer; }
        
        /* البنر المتحرك */
        .marquee { background: var(--gold); color: var(--main); padding: 8px; font-weight: bold; font-size: 14px; overflow: hidden; white-space: nowrap; }
        .marquee span { display: inline-block; padding-left: 100%; animation: marquee 15s linear infinite; }
        @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }

        /* الأقسام */
        .cats { display: flex; gap: 10px; padding: 10px; overflow-x: auto; background: white; border-bottom: 1px solid #ddd; }
        .cat-btn { padding: 8px 16px; background: #eee; border: none; border-radius: 20px; white-space: nowrap; font-weight: bold; color: #555; transition: 0.3s; }
        .cat-btn.active { background: var(--main); color: white; }

        /* المنتجات */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        .card { background: white; padding: 10px; border-radius: 10px; border: 1px solid #eee; display: flex; flex-direction: column; position: relative; }
        .card img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; background: #f0f0f0; margin-bottom: 8px; }
        .card h3 { font-size: 13px; margin: 0 0 5px; height: 35px; overflow: hidden; color: var(--main); }
        .card .price { font-size: 16px; font-weight: bold; color: var(--red); margin-bottom: 10px; }
        .like-btn { position: absolute; top: 10px; right: 10px; font-size: 18px; color: #ccc; cursor: pointer; }
        .like-btn.liked { color: var(--red); }
        .add-btn { background: var(--gold); border: none; padding: 10px; width: 100%; border-radius: 5px; font-weight: bold; color: var(--main); margin-top: auto; }
        
        /* السلة العائمة */
        .float-cart { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); width: 90%; background: var(--main); color: white; padding: 15px 20px; border-radius: 50px; display: none; justify-content: space-between; align-items: center; z-index: 1000; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }

        /* النوافذ المنبثقة */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 2000; display: none; }
        .modal { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 25px; border-radius: 20px 20px 0 0; z-index: 2100; transform: translateY(100%); transition: 0.3s; max-height: 80vh; overflow-y: auto; }
        .modal.show { transform: translateY(0); }
        
        input, select { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        .action-btn { width: 100%; padding: 15px; background: var(--main); color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; }

        /* تذييل الموقع */
        footer { background: var(--main); color: white; text-align: center; padding: 20px; position: absolute; bottom: 0; width: 100%; font-size: 14px; }
        
        #loader { position: fixed; inset: 0; background: rgba(255,255,255,0.9); z-index: 3000; display: none; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div id="loader">
    <i class="fas fa-spinner fa-spin fa-3x" style="color:var(--main)"></i>
    <p style="margin-top:15px; font-weight:bold;">جاري التنفيذ...</p>
</div>

<div class="overlay" onclick="closeAll()"></div>

<header>
    <div class="logo" onclick="adminAuth()">AL-BATOUL</div>
    <div onclick="openCart()"><i class="fas fa-shopping-cart"></i></div>
</header>

<div class="marquee">
    <span>🔥 تخفيضات هائلة لفترة محدودة! اطلب الآن واحصل على خصم 10% على كافة المنتجات! 🔥</span>
</div>

<div class="cats">
    <button class="cat-btn active" onclick="filter('الكل', this)">الكل</button>
    <button class="cat-btn" onclick="filter('منظفات', this)">منظفات</button>
    <button class="cat-btn" onclick="filter('أدوات منزلية', this)">أدوات منزلية</button>
</div>

<div class="grid" id="grid"></div>

<div class="float-cart" id="cartBar" onclick="openCart()">
    <span style="font-weight:bold">🛒 السلة (<span id="count">0</span>)</span>
    <span>إتمام الطلب <i class="fas fa-chevron-left"></i></span>
</div>

<div class="modal" id="adminModal">
    <h3 style="text-align:center">إضافة منتج</h3>
    <input type="text" id="pName" placeholder="اسم المنتج">
    <input type="number" id="pPrice" placeholder="السعر">
    <select id="pCat">
        <option>منظفات</option><option>أدوات منزلية</option><option>عناية شخصية</option>
    </select>
    <input type="file" id="pFile" accept="image/*" style="margin-bottom:15px;">
    <button class="action-btn" onclick="uploadItem()">حفظ المنتج</button>
</div>

<div class="modal" id="cartModal">
    <h3 style="text-align:center">إتمام الطلب</h3>
    <div id="cartList" style="margin-bottom:20px"></div>
    <input type="text" id="cName" placeholder="الاسم بالكامل">
    <input type="tel" id="cPhone" placeholder="رقم الهاتف">
    <select id="cPay">
        <option value="">طريقة الدفع</option>
        <option value="كاش">كاش عند الاستلام</option>
        <option value="فودافون كاش">فودافون كاش</option>
    </select>
    <select id="cRec">
        <option value="">طريقة الاستلام</option>
        <option value="شحن">شحن للمنزل</option>
        <option value="استلام">استلام من الفرع</option>
    </select>
    <button class="action-btn" style="background:var(--green)" onclick="sendWA()">إرسال الطلب عبر الواتساب</button>
</div>

<footer>
    <p>جميع الحقوق محفوظة &copy; البتول 2026</p>
    <p>تواصل معنا: 01030495245</p>
</footer>

<script>
    const firebaseConfig = { databaseURL: "https://testy-89b04-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let products = [];
    let cart = JSON.parse(localStorage.getItem('cart')) || {};
    let isAdmin = false;

    // جلب المنتجات
    db.ref('products').on('value', snap => {
        products = [];
        snap.forEach(c => {
            let p = c.val(); p.id = c.key;
            products.push(p);
        });
        render(products);
    });

    function render(list) {
        document.getElementById('grid').innerHTML = list.map(p => `
            <div class="card">
                <div class="del-icon" style="display:${isAdmin ? 'flex' : 'none'}" onclick="delItem('${p.id}')">X</div>
                <i class="fas fa-heart like-btn" onclick="toggleLike(this)"></i>
                <img src="${p.img}" loading="lazy">
                <h3>${p.name}</h3>
                <div class="price">${p.price} ج.م</div>
                <button class="add-btn" onclick="addToCart('${p.id}')">أضف للسلة</button>
            </div>
        `).join('');
    }

    // وظائف السلة
    function addToCart(id) {
        let p = products.find(x => x.id == id);
        if(cart[id]) cart[id].qty++; else cart[id] = {...p, qty: 1};
        saveCart();
    }
    function saveCart() { localStorage.setItem('cart', JSON.stringify(cart)); updateUI(); }
    function updateUI() {
        let c = 0; for(let k in cart) c += cart[k].qty;
        document.getElementById('count').innerText = c;
        document.getElementById('cartBar').style.display = c > 0 ? 'flex' : 'none';
    }
    
    function toggleLike(btn) { btn.classList.toggle('liked'); }

    function openCart() {
        let html = "", t = 0;
        for(let k in cart) {
            let s = cart[k].price * cart[k].qty; t += s;
            html += `<div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #eee;">
                <span>${cart[k].name} (x${cart[k].qty})</span>
                <div><b>${s}ج</b> <i class="fas fa-trash" style="color:red; cursor:pointer" onclick="remItem('${k}')"></i></div>
            </div>`;
        }
        document.getElementById('cartList').innerHTML = html;
        showModal('cartModal');
    }
    
    function remItem(id) { delete cart[id]; saveCart(); openCart(); if(Object.keys(cart).length==0) closeAll(); }

    // رفع المنتج
    async function uploadItem() {
        let f = document.getElementById('pFile').files[0];
        let n = document.getElementById('pName').value;
        let p = document.getElementById('pPrice').value;
        let c = document.getElementById('pCat').value;
        if(!f || !n || !p) return alert("الرجاء ملء كافة البيانات");
        document.getElementById('loader').style.display = "flex";
        try {
            let fd = new FormData(); fd.append("image", f);
            let res = await fetch("https://api.imgbb.com/1/upload?key=604f37803d159f801a6b0c2a5146c873", {method: "POST", body: fd});
            let data = await res.json();
            if(data.success) {
                await db.ref('products').push({name:n, price:Number(p), cat:c, img:data.data.url});
                alert("تمت الإضافة!"); closeAll();
            }
        } catch(e) { alert("خطأ في الرفع"); }
        document.getElementById('loader').style.display = "none";
    }

    // إرسال للواتساب
    function sendWA() {
        let n = document.getElementById('cName').value, ph = document.getElementById('cPhone').value;
        let pay = document.getElementById('cPay').value, rec = document.getElementById('cRec').value;
        if(!n || !ph || !pay || !rec) return alert("يرجى ملء بيانات الطلب");
        
        let msg = `*طلب جديد*%0A*الاسم:* ${n}%0A*الهاتف:* ${ph}%0A*الدفع:* ${pay}%0A*الاستلام:* ${rec}%0A%0A*الطلبات:*%0A`;
        let total = 0;
        for(let k in cart) {
            msg += `- ${cart[k].name} (x${cart[k].qty}) = ${cart[k].price * cart[k].qty}ج%0A`;
            total += (cart[k].price * cart[k].qty);
        }
        msg += `%0A*الإجمالي:* ${total} ج.م`;
        window.open(`https://wa.me/201030495245?text=${msg}`);
    }

    function adminAuth() { if(prompt("كلمة السر:") == "Batoul@2026") { isAdmin = true; render(products); showModal('adminModal'); } }
    function delItem(id) { if(confirm("حذف؟")) db.ref('products').child(id).remove(); }
    function filter(c, btn) {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render(c == 'الكل' ? products : products.filter(x => x.cat == c));
    }
    function showModal(id) { document.querySelector('.overlay').style.display='block'; document.getElementById(id).classList.add('show'); }
    function closeAll() { document.querySelector('.overlay').style.display='none'; document.querySelectorAll('.modal').forEach(m => m.classList.remove('show')); }
    
    updateUI();
</script>
</body>
</html>
