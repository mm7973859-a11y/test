<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>البتول | AL-BATOUL</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root { --main: #001d3d; --accent: #a50044; --gold: #edbb00; --bg: #f2f5f8; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); padding-bottom: 90px; }
        header { background: var(--main); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 18px; font-weight: 900; cursor: pointer; }
        .cat-scroll { display: flex; overflow-x: auto; padding: 15px; gap: 10px; background: white; border-bottom: 1px solid #eee; }
        .cat-card { min-width: 70px; text-align: center; font-size: 10px; font-weight: bold; }
        .cat-icon { width: 45px; height: 45px; background: #f0f2f5; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 5px; font-size: 18px; color: var(--main); }
        .cat-card.active .cat-icon { background: var(--accent); color: white; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        .card { background: white; border-radius: 12px; padding: 8px; border: 1px solid #eee; }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 8px; }
        .price { color: var(--accent); font-weight: bold; margin: 5px 0; }
        .add-btn { background: var(--gold); border: none; width: 100%; padding: 8px; border-radius: 6px; font-weight: bold; }
        .cart-float { position: fixed; bottom: 15px; left: 15px; right: 15px; background: var(--main); color: white; padding: 15px; border-radius: 50px; display: none; justify-content: space-between; z-index: 1001; }
        .admin-page, .modal-page { position: fixed; inset: 0; background: white; z-index: 3000; display: none; padding: 20px; overflow-y: auto; }
        .admin-input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; }
        #uploadLoader { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 4000; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; }
    </style>
</head>
<body>

<div id="uploadLoader">
    <i class="fas fa-spinner fa-spin fa-2x"></i>
    <p style="margin-top:10px;">جاري معالجة خفيفة للصورة...</p>
</div>

<header>
    <div onclick="location.reload()"><i class="fas fa-bars"></i></div>
    <div class="logo" onclick="openAdmin()">AL-BATOUL | البتول</div>
    <div></div>
</header>

<div class="cat-scroll" id="catBar">
    <div class="cat-card active" onclick="filter('الكل', this)"><div class="cat-icon"><i class="fas fa-th"></i></div><span>الكل</span></div>
    <div class="cat-card" onclick="filter('منظفات', this)"><div class="cat-icon"><i class="fas fa-pump-soap"></i></div><span>منظفات</span></div>
    <div class="cat-card" onclick="filter('أدوات منزلية', this)"><div class="cat-icon"><i class="fas fa-utensils"></i></div><span>منزلية</span></div>
    <div class="cat-card" onclick="filter('عناية شخصية', this)"><div class="cat-icon"><i class="fas fa-sparkles"></i></div><span>عناية</span></div>
</div>

<div class="grid" id="productGrid"></div>

<div class="cart-float" id="cartBtn" onclick="openReview()">
    <span>🛒 السلة (<span id="count">0</span>)</span>
    <span>مراجعة الطلب <i class="fas fa-arrow-left"></i></span>
</div>

<div id="admin" class="admin-page">
    <div style="display:flex; justify-content:space-between;">
        <h3>إدارة المنتجات</h3>
        <button onclick="closeAdmin()">X</button>
    </div>
    <input type="text" id="adminName" class="admin-input" placeholder="اسم المنتج">
    <input type="number" id="adminPrice" class="admin-input" placeholder="السعر">
    <input type="file" id="adminFile" class="admin-input" accept="image/*">
    <select id="adminCat" class="admin-input">
        <option value="منظفات">منظفات</option>
        <option value="أدوات منزلية">أدوات منزلية</option>
        <option value="عناية شخصية">عناية شخصية</option>
    </select>
    <button class="add-btn" style="padding:15px;" onclick="handleSave()">حفظ المنتج</button>
    <div id="adminList" style="margin-top:20px;"></div>
</div>

<div id="reviewModal" class="modal-page">
    <h3>مراجعة الطلب</h3>
    <div id="reviewItems"></div>
    <div id="reviewTotal" style="font-weight:bold; margin:20px 0; text-align:center;"></div>
    <input type="text" id="custName" class="admin-input" placeholder="الاسم">
    <input type="tel" id="custPhone" class="admin-input" placeholder="رقم الهاتف">
    <button class="add-btn" style="background:#25D366; color:white;" onclick="sendToWA()">تأكيد عبر واتساب</button>
    <button onclick="closeReview()" style="width:100%; margin-top:10px; border:none; background:none;">إلغاء</button>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://testy-89b04-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let allProducts = [], cart = {};

    db.ref('products').on('value', snap => {
        allProducts = [];
        const list = document.getElementById('adminList'); list.innerHTML = "";
        snap.forEach(child => {
            const p = child.val(); p.key = child.key;
            allProducts.push(p);
            list.innerHTML += `<div style="padding:10px; border-bottom:1px solid #eee;">${p.name} <i class="fas fa-trash" style="color:red; float:left;" onclick="deleteProduct('${p.key}')"></i></div>`;
        });
        render(allProducts);
    });

    function render(data) {
        document.getElementById('productGrid').innerHTML = data.map(p => `
            <div class="card">
                <img src="${p.img}">
                <div style="font-size:12px; height:30px; margin-top:5px;">${p.name}</div>
                <div class="price">${p.price} ج.م</div>
                <button class="add-btn" onclick="addToCart('${p.key}')">إضافة</button>
            </div>
        `).join('');
    }

    async function handleSave() {
        const file = document.getElementById('adminFile').files[0];
        const name = document.getElementById('adminName').value;
        const price = document.getElementById('adminPrice').value;
        if(!file || !name || !price) return alert("أكمل البيانات");

        document.getElementById('uploadLoader').style.display = "flex";
        try {
            const compressed = await compressLowMem(file);
            const fd = new FormData();
            fd.append('image', compressed);
            const res = await fetch('https://api.imgbb.com/1/upload?key=604f37803d159f801a6b0c2a5146c873', { method: 'POST', body: fd });
            const d = await res.json();
            if(d.success) {
                await db.ref('products').push({ name, price: parseInt(price), img: d.data.url, cat: document.getElementById('adminCat').value });
                alert("تم الحفظ");
                document.getElementById('adminFile').value = "";
            }
        } catch(e) { alert("خطأ في الذاكرة: حاول اختيار صورة أصغر أو مسح الرامات"); }
        document.getElementById('uploadLoader').style.display = "none";
    }

    // وظيفة ضغط موفرة جداً للذاكرة
    function compressLowMem(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const width = 600; // حجم صغير جداً لتوفير الرام
                    const scale = width / img.width;
                    canvas.width = width;
                    canvas.height = img.height * scale;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    canvas.toBlob(b => resolve(b), 'image/jpeg', 0.6);
                };
            };
        });
    }

    function addToCart(k) {
        const p = allProducts.find(i=>i.key===k);
        cart[k] = cart[k] ? {...p, qty: cart[k].qty+1} : {...p, qty: 1};
        let c = 0; for(let x in cart) c+=cart[x].qty;
        document.getElementById('count').innerText = c;
        document.getElementById('cartBtn').style.display = "flex";
    }

    function openReview() {
        let h = "", t = 0;
        for(let k in cart) {
            let s = cart[k].price * cart[k].qty; t += s;
            h += `<div style="padding:10px; border-bottom:1px solid #eee;">${cart[k].name} (x${cart[k].qty}) - ${s}ج</div>`;
        }
        document.getElementById('reviewItems').innerHTML = h;
        document.getElementById('reviewTotal').innerText = "الإجمالي: " + t + " ج.م";
        document.getElementById('reviewModal').style.display = "block";
    }

    function sendToWA() {
        const n = document.getElementById('custName').value;
        if(!n) return alert("ادخل اسمك");
        let m = `طلب جديد من ${n}:%0A`;
        for(let k in cart) m += `- ${cart[k].name} (x${cart[k].qty})%0A`;
        window.open(`https://wa.me/201030495245?text=${m}`);
        alert("شكراً لك! تم إرسال طلبك.");
    }

    function openAdmin() { if(prompt("كلمة السر:")==="Batoul@2026") document.getElementById('admin').style.display="block"; }
    function closeAdmin() { document.getElementById('admin').style.display="none"; }
    function closeReview() { document.getElementById('reviewModal').style.display="none"; }
    function deleteProduct(k) { if(confirm("حذف؟")) db.ref('products').child(k).remove(); }
    function filter(c, b) {
        document.querySelectorAll('.cat-card').forEach(i=>i.classList.remove('active'));
        b.classList.add('active');
        render(c==='الكل' ? allProducts : allProducts.filter(p=>p.cat===c));
    }
</script>
</body>
</html>
