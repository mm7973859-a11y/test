<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متجر بسيط</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f5f5f5;
}
header{
    background:#222;
    color:#fff;
    padding:15px;
    display:flex;
    justify-content:space-between;
}
.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    padding:10px;
}
.card{
    background:#fff;
    padding:10px;
    border-radius:8px;
}
.card img{
    width:100%;
    border-radius:8px;
}
.price{
    color:red;
    font-weight:bold;
}
button{
    width:100%;
    padding:10px;
    border:none;
    background:#ffcc00;
    font-weight:bold;
    cursor:pointer;
}
.cart{
    position:fixed;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    background:#222;
    color:#fff;
    padding:15px 20px;
    border-radius:30px;
    display:none;
}
</style>
</head>

<body>

<header>
    <div>متجري</div>
    <div>🛒 <span id="count">0</span></div>
</header>

<div class="grid" id="products"></div>

<div class="cart" id="cartBox">
    الإجمالي: <span id="total">0</span> جنيه
</div>

<script>
const products = [
    {id:1, name:"سائل تنظيف", price:30, img:"https://via.placeholder.com/300"},
    {id:2, name:"شامبو", price:40, img:"https://via.placeholder.com/300"},
    {id:3, name:"منشفة", price:50, img:"https://via.placeholder.com/300"},
    {id:4, name:"لعبة أطفال", price:70, img:"https://via.placeholder.com/300"}
];

let cart = {};

function showProducts(){
    let box = document.getElementById("products");
    box.innerHTML = "";
    products.forEach(p=>{
        box.innerHTML += `
        <div class="card">
            <img src="${p.img}">
            <h4>${p.name}</h4>
            <div class="price">${p.price} ج</div>
            <button onclick="add(${p.id})">أضف للسلة</button>
        </div>
        `;
    });
}

function add(id){
    let p = products.find(x=>x.id===id);
    cart[id] ? cart[id].qty++ : cart[id]={...p, qty:1};
    updateCart();
}

function updateCart(){
    let count=0, total=0;
    for(let k in cart){
        count+=cart[k].qty;
        total+=cart[k].price*cart[k].qty;
    }
    document.getElementById("count").innerText = count;
    document.getElementById("total").innerText = total;
    document.getElementById("cartBox").style.display = count>0 ? "block":"none";
}

showProducts();
</script>

</body>
</html>
