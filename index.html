<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>البتول | AL-BATOUL</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root { --main: #001d3d; --accent: #a50044; --gold: #edbb00; --bg: #f2f5f8; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; background: var(--bg); padding-bottom: 90px; }

        header { background: var(--main); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 18px; font-weight: 900; cursor: pointer; }
        .menu-icon { font-size: 24px; color: var(--gold); cursor: pointer; }

        .drawer { position: fixed; top: 0; right: -280px; width: 280px; height: 100%; background: white; z-index: 2000; transition: 0.4s; padding: 20px; box-shadow: -5px 0 15px rgba(0,0,0,0.1); }
        .drawer.open { right: 0; }
        .drawer-item { padding: 15px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 12px; font-weight: bold; color: var(--main); cursor: pointer; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1999; display: none; }

        .cat-scroll { display: flex; overflow-x: auto; padding: 15px; gap: 15px; background: white; border-bottom: 1px solid #eee; }
        .cat-card { min-width: 75px; text-align: center; }
        .cat-icon { width: 50px; height: 50px; background: #f0f2f5; border-radius: 15px; display: flex; align-items: center; justify-content: center; margin: 0 auto 5px; font-size: 20px; color: var(--main); }
        .cat-card.active .cat-icon { background: var(--accent); color: white; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        .card { background: white; border-radius: 15px; padding: 10px; border: 1px solid #eee; display: flex; flex-direction: column; }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 10px; margin-bottom: 8px; }
        .price { color: var(--accent); font-weight: 800; font-size: 15px; margin: 8px 0; }

        .qty-box { display: flex; align-items: center; justify-content: space-between; background: #f0f2f5; border-radius: 8px; padding: 4px; }
        .qty-btn { border: none; background: none; font-size: 16px; width: 25px; cursor: pointer; }
        .add-btn { background: var(--gold); border: none; width: 100%; padding: 10px; border-radius: 8px; font-weight: bold; margin-top: 8px; }

        .admin-page, .modal-page { position: fixed; inset: 0; background: white; z-index: 3000; display: none; padding: 20px; overflow-y: auto; }
        .admin-input, .review-input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; }
        .admin-btn { background: var(--main); color: white; border: none; width: 100%; padding: 15px; border-radius: 10px; font-weight: bold; margin-bottom: 15px; }

        .cart-float { position: fixed; bottom: 15px; left: 15px; right: 15px; background: var(--main); color: white; padding: 15px 20px; border-radius: 50px; display: flex; justify-content: space-between; align-items: center; z-index: 1001; }
        
        /* Loading Overlay */
        #uploadLoader { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 4000; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; }
    </style>
</head>
<body>

<div id="uploadLoader">
    <i class="fas fa-spinner fa-spin fa-3x"></i>
    <p id="loaderStatus" style="margin-top:15px; font-weight:bold;">جاري معالجة الصورة...</p>
</div>

<div class="overlay" onclick="toggleMenu()"></div>
<div class="drawer" id="menu">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 style="color:var(--accent)">القائمة</h3>
        <i class="fas fa-times" onclick="toggleMenu()"></i>
    </div>
    <div class="drawer-item" onclick="filter('الكل')"><i class="fas fa-home"></i> الرئيسية</div>
    <div class="drawer-item" onclick="document.getElementById('about').scrollIntoView(); toggleMenu()"><i class="fas fa-info-circle"></i> عن المتجر</div>
</div>

<header>
    <div class="menu-icon" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
    <div class="logo" onclick="openAdmin()">AL-BATOUL | البتول</div>
    <div style="width:25px"></div>
</header>

<div class="cat-scroll">
    <div class="cat-card active" onclick="filter('الكل', this)"><div class="cat-icon"><i class="fas fa-th"></i></div><span>الكل</span></div>
    <div class="cat-card" onclick="filter('منظفات', this)"><div class="cat-icon"><i class="fas fa-pump-soap"></i></div><span>منظفات</span></div>
    <div class="cat-card" onclick="filter('أدوات منزلية', this)"><div class="cat-icon"><i class="fas fa-utensils"></i></div><span>منزلية</span></div>
</div>

<div class="grid" id="productGrid"></div>

<div id="admin" class="admin-page">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3>إدارة المنتجات</h3>
        <button onclick="closeAdmin()">X</button>
    </div>
    <div style="background:#f9f9f9; padding:15px; border-radius:15px;">
        <input type="text" id="adminName" class="admin-input" placeholder="اسم المنتج">
        <input type="number" id="adminPrice" class="admin-input" placeholder="السعر">
        <input type="file" id="adminFile" class="admin-input" accept="image/*">
        <select id="adminCat" class="admin-input">
            <option value="منظفات">منظفات</option>
            <option value="أدوات منزلية">أدوات منزلية</option>
            <option value="عروض">عروض 🔥</option>
        </select>
        <button class="admin-btn" onclick="handleSave()">حفظ المنتج الجديد</button>
    </div>
    <div id="adminList" style="margin-top:20px;"></div>
</div>

<script>
    // تكوين Firebase
    const firebaseConfig = { databaseURL: "https://testy-89b04-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // جلب المنتجات
    db.ref('products').on('value', snap => {
        const grid = document.getElementById('productGrid');
        const list = document.getElementById('adminList');
        grid.innerHTML = ""; list.innerHTML = "";
        
        snap.forEach(child => {
            const p = child.val(); p.key = child.key;
            grid.innerHTML += `
                <div class="card">
                    <img src="${p.img}" onerror="this.src='https://via.placeholder.com/150?text=Error'">
                    <h4>${p.name}</h4>
                    <div class="price">${p.price} ج.م</div>
                    <button class="add-btn">إضافة للسلة</button>
                </div>`;
            list.innerHTML += `<div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #eee;">
                <span>${p.name}</span>
                <i class="fas fa-trash" style="color:red" onclick="deleteProduct('${p.key}')"></i>
            </div>`;
        });
    });

    async function handleSave() {
        const file = document.getElementById('adminFile').files[0];
        const name = document.getElementById('adminName').value;
        const price = document.getElementById('adminPrice').value;
        const cat = document.getElementById('adminCat').value;
        const loader = document.getElementById('uploadLoader');
        const status = document.getElementById('loaderStatus');

        if(!file || !name || !price) return alert("يرجى ملء كافة الحقول");

        loader.style.display = "flex";
        
        try {
            status.innerText = "جاري ضغط وتصغير الصورة...";
            const compressed = await compressImage(file);
            
            status.innerText = "جاري الرفع إلى السيرفر...";
            const formData = new FormData();
            formData.append('image', compressed);

            // تم تغيير المفتاح لمفتاح جديد
            const res = await fetch('https://api.imgbb.com/1/upload?key=8c7836858e75b95c6f6002f231e3381e', {
                method: 'POST',
                body: formData
            });

            const data = await res.json();
            
            if(data.success) {
                status.innerText = "تم الرفع.. جاري الحفظ في قاعدة البيانات...";
                await db.ref('products').push({
                    name: name,
                    price: parseInt(price),
                    img: data.data.url,
                    cat: cat
                });
                alert("تمت الإضافة بنجاح!");
                document.getElementById('adminName').value = "";
                document.getElementById('adminFile').value = "";
            } else {
                throw new Error(data.error.message || "فشل الرفع للسيرفر");
            }
        } catch (error) {
            console.error(error);
            alert("فشل الإضافة: " + error.message);
        } finally {
            loader.style.display = "none";
        }
    }

    function compressImage(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const width = Math.min(img.width, 600); // تصغير العرض لـ 600 بكسل فقط
                    const height = (img.height / img.width) * width;
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    canvas.toBlob((blob) => resolve(blob), 'image/jpeg', 0.6); // ضغط الجودة لـ 60%
                };
            };
        });
    }

    function openAdmin() { if(prompt("كلمة السر:") === "Batoul@2026") document.getElementById('admin').style.display='block'; }
    function closeAdmin() { document.getElementById('admin').style.display='none'; }
    function deleteProduct(key) { if(confirm("حذف؟")) db.ref('products').child(key).remove(); }
    function toggleMenu() { document.getElementById('menu').classList.toggle('open'); document.querySelector('.overlay').style.display = document.getElementById('menu').classList.contains('open') ? 'block' : 'none'; }
    function filter(c, b) { if(b) { document.querySelectorAll('.cat-card').forEach(i=>i.classList.remove('active')); b.classList.add('active'); } }
</script>
</body>
</html>
